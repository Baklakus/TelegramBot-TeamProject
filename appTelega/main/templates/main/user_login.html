<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в аккаунт</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/css/styles.css' %}">
</head>
<body>
    <header>
        <div>
            <a href="/">Опросник</a>
            <button onclick="location.href='/'">На главную</button>
        </div>
    </header>

    <main class="auth-container">
        <div id="auth-form-wrapper">
            <form method="post" class="auth-form">
                {% csrf_token %}
                <h1 class="auth-title">Вход</h1>

                <div class="auth-field">
                    <label class="auth-label" for="username">Логин</label>
                    <input class="auth-input" type="text" name="username" required>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="password">Пароль</label>
                    <input class="auth-input" type="password" name="password" required>
                </div>

                <button class="auth-button" type="submit">Войти</button>
            </form>
        </div>
    </main>

    <footer>
        <p>LADA SPIRT</p>
    </footer>

    <style>
        /* Фиксированные стили для входной формы */
        .auth-input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .auth-button {
            width: 100%;
            padding: 0.8rem;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: none; /* Убираем анимации */
        }

        .auth-button:hover {
            background-color: #45a049; /* Цвет кнопки при наведении */
            opacity: 0.9; /* Легкое затемнение при наведении */
        }

        .auth-field {
            margin-bottom: 1.2rem;
        }

        .auth-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
        }

        .auth-title {
            margin: 0 0 1.5rem 0;
            color: #333;
            text-align: center;
            font-size: 1.5rem;
        }

        /* Стиль для футера */
        footer {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: auto;
        }
    </style>
</body>
</html>
