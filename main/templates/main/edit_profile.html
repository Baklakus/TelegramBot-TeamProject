<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование пользователя</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/css/styles.css' %}">
</head>
<body>

<header>
    <div>
        <a href="{% url 'index' %}">Опросник</a>
        <button onclick="location.href='{% url 'index' %}'">На главную</button>
    </div>
</header>

<main class="auth-container">
    <form method="post" class="auth-form">
        {% csrf_token %}
        <h1 class="auth-title">Редактирование доступа</h1>

        {% if error %}
            <p style="color:red">{{ error }}</p>
        {% endif %}

        <!-- Поле для логина -->
        <div class="auth-field">
            <label class="auth-label" for="username">Логин</label>
            <input class="auth-input" type="text" name="username" id="username" value="{{ user.username }}" required>
        </div>

        <!-- Выбор роли пользователя (администратор или ведущий) -->
        <div class="auth-field">
            <label class="auth-label" for="role">Роль</label>
            <select class="auth-input" name="role" id="role" required>
                <option value="admin" {% if request.user.groups.first.name == 'Администратор' %}selected{% endif %}>Администратор</option>
                <option value="host" {% if request.user.groups.first.name == 'Ведущий' %}selected{% endif %}>Ведущий</option>
            </select>
        </div>

         <div class="auth-field">
            <label class="auth-label" for="new_password1">Новый пароль</label>
            <input class="auth-input" type="password" name="new_password1" id="new_password1" required>
        </div>

        <div class="auth-field">
            <label class="auth-label" for="new_password2">Подтверждение пароля</label>
            <input class="auth-input" type="password" name="new_password2" id="new_password2" required>
        </div>


        <button class="auth-button" type="submit">Сохранить изменения</button>
    </form>
</main>

<footer>
    <p>LADA SPIRT</p>
</footer>

</body>
</html>
